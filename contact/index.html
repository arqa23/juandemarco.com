<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Juan De Marco</title>
  <meta name="description" content="Juan De Marco">
  <link rel="preload" href="/fonts/jost-latin-300-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <script src="/images.js"></script>
  <script>
    // Pick one image at random before the page draws, so there is no flash.
    (function () {
      var list = window.COVER_IMAGES || [];
      if (!list.length) return;
      var pick = list[Math.floor(Math.random() * list.length)];
      window.COVER_PICK = pick;
      var l = document.createElement('link');
      l.rel = 'preload'; l.as = 'image'; l.href = pick;
      document.head.appendChild(l);
    })();
  </script>
</head>
<body class="inner photo">
  <img id="cover" class="cover" alt="" decoding="async" fetchpriority="high">
  <script>
    (function () {
      var img = document.getElementById('cover');
      if (!window.COVER_PICK) { img.remove(); return; }
      img.onload = function () { img.classList.add('loaded'); };
      img.src = window.COVER_PICK;
    })();
  </script>
  <div class="scroller">
  <main class="page">
    <h1>Contact</h1>
    <p>For commissions, collaborations and studio inquiries:</p>
    <p class="email"><a id="email" href="/contact/">juan [at] juandemarco.com</a></p>
    <script>
      // Assemble the address in the browser so simple spam bots can't read it from the page.
      (function () {
        var a = document.getElementById('email'), e = "juan" + '@' + "juandemarco.com";
        a.href = 'mailto:' + e; a.textContent = e;
      })();
    </script>
  </main>
  </div>

  <header class="site-header">
    <a class="logo" href="/">JUAN DE MARCO</a>
  </header>

  <nav class="nav" aria-label="Main">
      <a href="/"><span class="nav-label">Home</span><span class="nav-dot" aria-hidden="true"></span></a>
      <a href="/work/"><span class="nav-label">Work</span><span class="nav-dot" aria-hidden="true"></span></a>
      <a href="/contact/" aria-current="page"><span class="nav-label">Contact</span><span class="nav-dot" aria-hidden="true"></span></a>
      <a href="/about/"><span class="nav-label">About</span><span class="nav-dot" aria-hidden="true"></span></a>
  </nav>

  <footer class="site-footer">
    <span>&copy; 2026 Juan De Marco</span>
    <span>All Rights Reserved</span>
  </footer>
</body>
</html>
