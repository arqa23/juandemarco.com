<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Juan De Marco</title>
  <meta name="description" content="Juan De Marco">
  <link rel="preload" href="/fonts/jost-latin-300-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css?v=4a12f6ce">
  <script>try{var t=localStorage.getItem('jdm-theme');if(t&&t!=='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  <script src="/images.js?v=4a12f6ce"></script>
  <script src="/site.js?v=4a12f6ce" defer></script>
</head>
<body class="home">
  <img id="cover" class="cover" alt="" decoding="async" fetchpriority="high">
  <script>
    // Pick one cover image at random on every visit.
    (function () {
      var img = document.getElementById('cover'), list = window.COVER_IMAGES || [];
      if (!list.length) { img.remove(); return; }
      img.onload = function () { img.classList.add('loaded'); };
      img.src = list[Math.floor(Math.random() * list.length)];
    })();
  </script>

  <header class="site-header">
    <a class="logo" href="/">JUAN DE MARCO</a>
  </header>

  <nav class="nav" aria-label="Main">
      <a href="/" aria-current="page"><span class="nav-label">Home</span><span class="nav-dot" aria-hidden="true"></span></a>
      <a href="/work/"><span class="nav-label">Work</span><span class="nav-dot" aria-hidden="true"></span></a>
      <a href="/contact/"><span class="nav-label">Contact</span><span class="nav-dot" aria-hidden="true"></span></a>
      <a href="/about/"><span class="nav-label">About</span><span class="nav-dot" aria-hidden="true"></span></a>
      <a href="/login/"><span class="nav-label">Login</span><span class="nav-dot" aria-hidden="true"></span></a>
      <button class="settings-btn" type="button" aria-expanded="false" aria-controls="settings"><span class="nav-label">Settings</span><span class="nav-dot" aria-hidden="true"></span></button>
  </nav>

  <div class="settings" id="settings" hidden>
    <div class="settings-row">
      <span class="settings-label">Mode</span>
      <button type="button" data-theme-set="light">Light</button>
      <button type="button" data-theme-set="dark">Dark</button>
      <button type="button" data-theme-set="white">White</button>
      <button type="button" data-theme-set="black">Black</button>
    </div>
    <div class="settings-row">
      <span class="settings-label">Screen</span>
      <button type="button" data-fullscreen>Full screen</button>
    </div>
  </div>

  <footer class="site-footer">
    <span>&copy; 2026 Juan De Marco</span>
    <span>All Rights Reserved</span>
  </footer>
</body>
</html>
